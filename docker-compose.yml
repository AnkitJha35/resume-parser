services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-parser-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - WORKERS=1
      - KAFKA_ENABLED=false
      - SEMANTIC_PROVIDER=gemini
      - GEMINI_MODEL=gemini-3.5-flash-lite
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume-parser-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
